services:
  controller:
    image: jenkins/jenkins:2.541.3-lts-jdk17
    container_name: secure-software-delivery-jenkins
    user: root
    restart: "no"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc.yaml
      DEMO_GITHUB_TOKEN: ${DEMO_GITHUB_TOKEN:-unset}
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc.yaml:/var/jenkins_home/casc.yaml:ro
      - ./plugins.txt:/usr/share/jenkins/ref/plugins.txt:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    command:
      - /bin/bash
      - -c
      - |
        jenkins-plugin-cli \
          --plugin-file /usr/share/jenkins/ref/plugins.txt \
          --plugin-download-directory /var/jenkins_home/plugins
        exec /usr/local/bin/jenkins.sh

volumes:
  jenkins_home:
