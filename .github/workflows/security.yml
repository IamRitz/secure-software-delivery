name: Security checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      break_glass_demo:
        description: Synthetic eligible BLOCK for the Phase 11 interaction demo
        required: true
        default: none
        type: choice
        options:
          - none
          - sast
          - dependency
      break_glass_pr_number:
        description: PR number that receives the audited decision comment
        required: false
        type: string
      break_glass_notify_url:
        description: Override the notify webhook (e.g. the Slack dev endpoint); falls back to vars.BREAK_GLASS_NOTIFY_URL
        required: false
        type: string
      break_glass_status_url:
        description: Override the status webhook (e.g. the Slack dev endpoint); falls back to vars.BREAK_GLASS_STATUS_URL
        required: false
        type: string

permissions:
  contents: read

jobs:
  secret-scanning:
    name: Secret scanning
    runs-on: ubuntu-latest

    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for report normalization
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Create report directory
        run: mkdir -p reports

      - name: Determine secret scan scope
        # pull_request: only commits on the branch since the merge-base with the base branch.
        # push to main: only commits since the previous main tip (github.event.before).
        # schedule / dispatch / anything else: full history.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          BASE_SHA=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
            BASE_SHA="$(git merge-base "origin/$BASE_REF" HEAD || true)"
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              BASE_SHA="$BEFORE_SHA"
            fi
          fi
          if [ -n "$BASE_SHA" ]; then
            echo "GITLEAKS_LOG_OPTS=--log-opts=${BASE_SHA}..HEAD" >> "$GITHUB_ENV"
            echo "TRUFFLEHOG_SINCE=--since-commit=${BASE_SHA}" >> "$GITHUB_ENV"
            echo "Incremental secret scan range ${BASE_SHA}..HEAD (event=$EVENT_NAME)"
          else
            echo "GITLEAKS_LOG_OPTS=--log-opts=HEAD" >> "$GITHUB_ENV"
            echo "TRUFFLEHOG_SINCE=" >> "$GITHUB_ENV"
            echo "Full-history secret scan (event=$EVENT_NAME)"
          fi

      - name: Run Gitleaks (report only)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$GITHUB_WORKSPACE/reports:/reports" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml ${GITLEAKS_LOG_OPTS} --platform github \
            --no-banner --redact=100 --report-format json \
            --report-path /reports/gitleaks.json --exit-code 0

      - name: Run TruffleHog (report only)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            trufflesecurity/trufflehog@sha256:deb2af10659a488a14d262a323addcde099d99827a1cf1dc4e93c17915c39f08 \
            git file:///repo --json --no-update ${TRUFFLEHOG_SINCE} \
            --exclude-paths=/repo/.trufflehog-exclude-paths.txt \
            --results=verified,unverified,unknown --no-fail \
            --fail-on-scan-errors > reports/trufflehog.raw.jsonl
          node security/scripts/normalize-trufflehog.mjs \
            reports/trufflehog.raw.jsonl reports/trufflehog.json

      - name: Upload secret scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-scan-reports
          path: |
            reports/gitleaks.json
            reports/trufflehog.json
          if-no-files-found: error
          retention-days: 14

  dependency-scanning:
    name: Dependency scanning
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Create report directory
        run: mkdir -p reports

      - name: Detect dependency ecosystems
        # Decides which language-native scanner runs. npm audit needs a
        # package-lock.json; pip-audit needs a requirements.txt. OSV-Scanner runs
        # regardless and covers every ecosystem's lockfiles. Neither present is a
        # clean skip, mirroring the AWS-not-configured detect-and-skip pattern.
        id: detect
        run: node security/scripts/detect-ecosystems.mjs --github-output

      - name: Run npm audit (report only)
        if: steps.detect.outputs.package_lock == 'true'
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            set +e
            npm audit --json --package-lock-only > reports/npm-audit.json
            audit_status=$?
            set -e
            if node security/scripts/validate-dependency-report.mjs \
              npm-audit reports/npm-audit.json; then
              echo "npm audit produced a valid report (scanner exit $audit_status)"
              exit 0
            fi
            echo "npm audit report attempt $attempt was invalid; retrying" >&2
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          exit 1

      - name: Validate npm audit report
        if: steps.detect.outputs.package_lock == 'true'
        run: |
          node security/scripts/validate-dependency-report.mjs \
            npm-audit reports/npm-audit.json
          echo "npm audit report is valid; the security gate evaluates findings"

      - name: Run pip-audit (report only)
        # Python's npm-audit-equivalent. Pinned tool version; audits the pinned
        # requirements.txt with --no-deps so dependency RESOLUTION never runs (no
        # untrusted setup.py execution), the same discipline as npm ci vs install.
        if: steps.detect.outputs.requirements_txt != ''
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$GITHUB_WORKSPACE/reports:/reports" \
            -w /repo \
            python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea \
            sh -c 'pip install --quiet --no-cache-dir pip-audit==2.10.1 && pip-audit --requirement requirements.txt --no-deps --format json > /reports/pip-audit.json'

      - name: Validate pip-audit report
        if: steps.detect.outputs.requirements_txt != ''
        run: |
          node security/scripts/validate-dependency-report.mjs \
            pip-audit reports/pip-audit.json
          echo "pip-audit report is valid; the security gate evaluates findings"

      - name: Run OSV-Scanner (report only)
        # Cross-ecosystem backstop: recursively scans the checkout for every
        # supported lockfile (package-lock.json, requirements.txt, poetry.lock,
        # Pipfile.lock, ...) rather than a single hard-coded file.
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/google/osv-scanner@sha256:5116601dedc01c1c580eb92371883ec052fc4c13c3fbc109d621a63ac416d475 \
            scan source --recursive /repo --format=json \
            > reports/osv-scanner.json

      - name: Validate OSV-Scanner report
        run: |
          node security/scripts/validate-dependency-report.mjs \
            osv-scanner reports/osv-scanner.json
          echo "OSV-Scanner report is valid; the security gate evaluates findings"

      - name: Upload dependency scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # pip-audit.json is present only for Python repos; upload-artifact errors
          # only when NO listed file matches, so this stays green for npm-only repos.
          name: dependency-scan-reports
          path: |
            reports/npm-audit.json
            reports/pip-audit.json
            reports/osv-scanner.json
          if-no-files-found: error
          retention-days: 14

  sast:
    name: SAST
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so Semgrep can diff against the baseline commit.
          fetch-depth: 0

      - name: Set up Node.js for report validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Create report directory
        run: mkdir -p reports

      - name: Determine SAST scan scope
        # pull_request: only files changed since the merge-base with the base branch.
        # push to main: only files changed since the previous main tip (github.event.before).
        # schedule / dispatch / anything else: full scan (no baseline).
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          BASE_SHA=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
            BASE_SHA="$(git merge-base "origin/$BASE_REF" HEAD || true)"
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              BASE_SHA="$BEFORE_SHA"
            fi
          fi
          if [ -n "$BASE_SHA" ]; then
            echo "SEMGREP_BASELINE=--baseline-commit=${BASE_SHA}" >> "$GITHUB_ENV"
            echo "Incremental SAST scan since ${BASE_SHA} (event=$EVENT_NAME)"
          else
            echo "SEMGREP_BASELINE=" >> "$GITHUB_ENV"
            echo "Full-tree SAST scan (event=$EVENT_NAME)"
          fi

      - name: Run Semgrep OSS (report only)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$GITHUB_WORKSPACE/reports:/reports" \
            -w /src \
            -e HOME=/tmp \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
            semgrep/semgrep@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e \
            semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config security/semgrep-rules.yml \
            ${SEMGREP_BASELINE} \
            --json-output=/reports/semgrep.json \
            --metrics=off \
            --disable-version-check \
            src
          node security/scripts/validate-semgrep-report.mjs reports/semgrep.json
          echo "Semgrep report is ready for the security gate"

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sast-reports
          path: reports/semgrep.json
          if-no-files-found: error
          retention-days: 14

  security-gate:
    name: security-gate
    needs:
      - secret-scanning
      - dependency-scanning
      - sast
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out gate policy and evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Download secret scan reports
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: secret-scan-reports
          path: reports

      - name: Download dependency scan reports
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-scan-reports
          path: reports

      - name: Download SAST report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sast-reports
          path: reports

      - name: Require explicit dev endpoints for a synthetic demo run
        # A synthetic BLOCK must never fall back to the production repo Variables.
        # If break_glass_demo is set, both override URLs must be provided explicitly.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.break_glass_demo != 'none' && (inputs.break_glass_notify_url == '' || inputs.break_glass_status_url == '') }}
        run: |
          echo "A synthetic break_glass_demo run must set BOTH break_glass_notify_url and break_glass_status_url." >&2
          echo "Refusing to fall back to the production BREAK_GLASS_* repo Variables for a synthetic BLOCK." >&2
          exit 1

      - name: Apply synthetic eligible BLOCK for a manual demo
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.break_glass_demo != 'none' }}
        env:
          DEMO_TYPE: ${{ inputs.break_glass_demo }}
        run: |
          case "$DEMO_TYPE" in
            sast)
              cp security/scripts/__fixtures__/new-high-sast/semgrep.json reports/semgrep.json
              ;;
            dependency)
              cp security/scripts/__fixtures__/critical-with-fix/npm-audit.json reports/npm-audit.json
              ;;
            *)
              echo "Unsupported break-glass demo type: $DEMO_TYPE" >&2
              exit 1
              ;;
          esac
          echo "Applied synthetic $DEMO_TYPE BLOCK input; no live vulnerable fixture was activated"

      - name: Evaluate security policy
        id: evaluate
        continue-on-error: true
        run: node security/scripts/security-gate.mjs

      - name: Confirm the BLOCK is eligible before loading any approval credential
        if: ${{ steps.evaluate.outcome == 'failure' }}
        run: node security/scripts/break-glass-notify.mjs --check-only

      - name: Request break-glass decision
        if: ${{ steps.evaluate.outcome == 'failure' }}
        env:
          BREAK_GLASS_NOTIFY_URL: ${{ inputs.break_glass_notify_url || vars.BREAK_GLASS_NOTIFY_URL }}
          BREAK_GLASS_SHARED_SECRET: ${{ secrets.BREAK_GLASS_SHARED_SECRET }}
          BREAK_GLASS_TIMEOUT_SECONDS: ${{ vars.BREAK_GLASS_TIMEOUT_SECONDS }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_PULL_REQUEST: ${{ github.event.pull_request.number || inputs.break_glass_pr_number }}
          CI_SYSTEM: github-actions
        run: node security/scripts/break-glass-notify.mjs

      - name: Wait for verified break-glass decision
        if: ${{ steps.evaluate.outcome == 'failure' }}
        env:
          BREAK_GLASS_STATUS_URL: ${{ inputs.break_glass_status_url || vars.BREAK_GLASS_STATUS_URL }}
          BREAK_GLASS_SHARED_SECRET: ${{ secrets.BREAK_GLASS_SHARED_SECRET }}
          BREAK_GLASS_TIMEOUT_SECONDS: ${{ vars.BREAK_GLASS_TIMEOUT_SECONDS }}
        run: node security/scripts/break-glass-poll.mjs

      - name: Upload security gate decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-gate-results
          path: |
            reports/security-gate.json
            reports/gate-exceptions.json
            reports/break-glass-request.json
            reports/break-glass-decision.json
          if-no-files-found: error
          retention-days: 14

  container-build:
    name: Container build
    # Holds ZERO cloud credentials: it only builds the image and uploads it as a
    # tarball artifact. The Trivy scan is a SEPARATE job (image-scan-prepush) so
    # it is visible in the Actions graph, not hidden inside the build. Runs on
    # PRs too so the image can be scanned before merge.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build application image without AWS credentials
        # PRs use the type=gha layer cache for fast feedback; the release build on
        # main uses no-cache so a potentially poisoned Actions cache entry can
        # never be baked into the image that actually ships (review §C3).
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          no-cache: ${{ github.ref == 'refs/heads/main' }}
          tags: secure-software-delivery:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image tarball
        run: docker save -o application-image.tar "secure-software-delivery:$GITHUB_SHA"

      - name: Upload image tarball for the scan and push jobs
        # Uploaded on every run (PRs included) so the separate image-scan-prepush
        # job can scan it, and (on main) the push job can load and push it.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-image-${{ github.sha }}
          path: application-image.tar
          if-no-files-found: error
          retention-days: 1

  image-scan-prepush:
    name: Image scan (pre-push)
    # The Trivy scan + pre-push image gate, as its own visible job (was a step
    # inside container-build). Holds ZERO cloud credentials — it scans the image
    # tarball artifact and runs the reviewed gate. A Critical/High-with-fix
    # finding, a secret, an EOSL OS, or an undetectable OS ("false clean") fails
    # this job on the PR, before merge. Runs on PRs too.
    needs:
      - container-build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Trivy's Metadata.ImageID (image config digest) — anchor of the
      # build -> push -> scan -> deploy digest chain (see docs/aws-setup.md).
      image_id: ${{ steps.trivy-id.outputs.image_id }}
    steps:
      - name: Check out scan scripts and policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Download image tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: application-image-${{ github.sha }}

      - name: Trivy image scan (report only — image-gate.mjs decides)
        # Pinned by digest and verified (see security/trivy-provenance.md). Scans
        # the tarball via --input; the Docker socket is never mounted into the
        # scanner. --exit-code 0: the scanner reports, our reviewed gate judges.
        run: |
          mkdir -p reports "$RUNNER_TEMP/trivy-cache"
          docker run --rm \
            -v "$GITHUB_WORKSPACE/application-image.tar:/in/image.tar:ro" \
            -v "$GITHUB_WORKSPACE/reports:/reports" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --input /in/image.tar \
              --scanners vuln,secret \
              --pkg-types os,library \
              --format json --output /reports/trivy-image.json \
              --exit-code 0 --quiet

      - name: Record scanned image ID
        id: trivy-id
        run: |
          image_id="$(node -e 'process.stdout.write(require("./reports/trivy-image.json").Metadata.ImageID)')"
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          echo "Trivy scanned image config digest: $image_id"

      - name: Pre-push image gate (fail-closed)
        run: >-
          node security/scripts/image-gate.mjs
          --source trivy
          --report reports/trivy-image.json
          --output reports/image-gate-prepush.json

      - name: Upload Trivy + pre-push gate reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-reports-${{ github.sha }}
          path: |
            reports/trivy-image.json
            reports/image-gate-prepush.json
          if-no-files-found: warn
          retention-days: 14

  aws-configuration:
    name: AWS configuration
    # Detection only (no credentials). Runs after the code gate and the pre-push
    # image gate; the actual credential boundary is the explicit push-to-main
    # guard below plus the OIDC trust policies pinned to refs/heads/main.
    needs:
      - security-gate
      - image-scan-prepush
    # EXPLICIT push-to-main guard. container-build now also runs on pull_request
    # (to scan the image with Trivy before merge), so it no longer implicitly
    # keeps the AWS jobs off PRs. Without this condition a PR run could reach the
    # push role — a credential-boundary regression. This event/ref check, plus the
    # OIDC trust policies' `sub` being pinned to `refs/heads/main`, means a PR can
    # assume no AWS role at all.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' &&
      needs.security-gate.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.detect.outputs.configured }}

    steps:
      - name: Detect AWS delivery configuration
        id: detect
        # Two OIDC roles: one for ECR push+scan (both are registry operations on
        # the same repo), one for the SSM deploy. The boundary that matters — the
        # credentials that can reach the instance — stays separate from the
        # registry credentials. All must be present, or the AWS stages skip.
        env:
          AWS_PUSH_SCAN_ROLE_ARN: ${{ vars.AWS_PUSH_SCAN_ROLE_ARN }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          missing=()
          for name in AWS_PUSH_SCAN_ROLE_ARN AWS_DEPLOY_ROLE_ARN AWS_REGION ECR_REPOSITORY EC2_INSTANCE_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "AWS delivery configuration is present; real AWS stages will run"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS not configured — ECR push, image scan, deploy gate, and deploy skipped; see docs/aws-setup.md. Missing: ${missing[*]}"
          fi

  # Delivery: three visibly-named jobs, TWO OIDC roles.
  #   push-and-scan (ECR write + scan-read) -> deploy-gate (no creds) -> deploy (SSM)
  # ECR push and the ECR scan-findings read are both registry operations on the
  # same repo, so they share one role and one job. The deploy role (SSM, reaches
  # the instance) stays separate — that is the boundary that matters. Fail-closed
  # by construction: each job `needs` the previous, and push-and-scan also `needs`
  # image-scan-prepush, so a failed pre-push gate skips the push entirely.

  push-and-scan:
    name: ECR push and scan
    needs:
      - security-gate
      - container-build
      - image-scan-prepush
      - aws-configuration
    # Explicit guard: first job to assume an AWS role, so never for a PR.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' &&
      needs.security-gate.result == 'success' &&
      needs.aws-configuration.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      registry: ${{ steps.ecr-login.outputs.registry }}
      image_digest: ${{ steps.push.outputs.image_digest }}
    steps:
      - name: Check out scan script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Download image tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: application-image-${{ github.sha }}

      - name: Load application image
        run: docker load -i application-image.tar

      - name: Assume the ECR push+scan role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_PUSH_SCAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ssd-ecr-push-scan

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Verify identity, push, and record the pushed manifest digest
        id: push
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          EXPECTED_IMAGE_ID: ${{ needs.image-scan-prepush.outputs.image_id }}
        run: |
          # Digest chain link 1 (build/scan -> push): the loaded artifact's config
          # digest must equal the ImageID Trivy scanned pre-push, or a different
          # image slipped in between scan and push.
          loaded_id="$(docker inspect --format '{{.Id}}' "secure-software-delivery:$GITHUB_SHA")"
          if [ "$loaded_id" != "$EXPECTED_IMAGE_ID" ]; then
            echo "loaded image $loaded_id != Trivy-scanned $EXPECTED_IMAGE_ID" >&2
            exit 1
          fi
          target="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker tag "secure-software-delivery:$GITHUB_SHA" "$target:$GITHUB_SHA"
          docker tag "secure-software-delivery:$GITHUB_SHA" "$target:demo"
          docker push "$target:$GITHUB_SHA"
          docker push "$target:demo"
          # Digest chain link 2: capture the immutable pushed manifest digest that
          # the scan (below) and deploy jobs pin to.
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$target:$GITHUB_SHA" | cut -d@ -f2)"
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pushed manifest digest: $digest"

      - name: Poll ECR image scan (by digest)
        continue-on-error: true
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          # Digest chain link 3 (push -> scan): poll ECR for the exact manifest
          # just pushed, not whatever the tag currently points at.
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
        run: |
          mkdir -p reports
          node security/scripts/poll-ecr-scan.mjs \
            --repository "$ECR_REPOSITORY" \
            --image-digest "$IMAGE_DIGEST" \
            --image-tag "$GITHUB_SHA" \
            --region "$AWS_REGION" \
            --output reports/ecr-image-scan.json
          # Guarantee the artifact exists even on a poll failure, so the deploy
          # gate fail-closes to BLOCK_DEPLOY on the empty report rather than
          # erroring on a missing artifact.
          [ -s reports/ecr-image-scan.json ] || printf '' > reports/ecr-image-scan.json

      - name: Upload raw image scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecr-image-scan
          path: reports/ecr-image-scan.json
          if-no-files-found: warn
          retention-days: 14

  deploy-gate:
    name: Deploy gate
    # The image gate — holds NO cloud credentials (no id-token). It only reads the
    # scan report and evaluates policy. A Critical/High finding, or a missing or
    # malformed report, makes image-gate.mjs exit non-zero -> this job FAILS ->
    # the deploy job (which needs it) is skipped and never starts.
    needs:
      - push-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out gate script and policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Download raw image scan report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ecr-image-scan
          path: reports

      - name: Assert the scanned digest is the pushed digest
        # Digest chain link 4: the report the gate is about to judge must be for
        # the exact manifest push-and-scan pushed. (poll-ecr-scan already bound
        # this by polling by digest; re-assert here so the gate is self-contained.)
        env:
          IMAGE_DIGEST: ${{ needs.push-and-scan.outputs.image_digest }}
        run: |
          scanned="$(node -e 'process.stdout.write((require("./reports/ecr-image-scan.json").image||{}).imageDigest||"")' 2>/dev/null || true)"
          if [ -n "$scanned" ] && [ "$scanned" != "$IMAGE_DIGEST" ]; then
            echo "scanned digest $scanned != pushed digest $IMAGE_DIGEST" >&2
            exit 1
          fi

      - name: Evaluate deploy policy (fail-closed)
        run: node security/scripts/image-gate.mjs

      - name: Upload deploy-gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-gate-result
          path: reports/image-gate.json
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Deploy
    # Runs only when deploy-gate SUCCEEDED (gate passed). Because `deploy` needs
    # `deploy-gate`, a failed gate skips this job entirely — it never starts, so a
    # Critical/High image finding can never reach a deploy. Holds SSM permissions
    # only (ssm:SendCommand + ssm:GetCommandInvocation); no ECR access.
    needs:
      - deploy-gate
      - push-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out deploy script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Assume the SSM deploy role (SSM only)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ssd-deploy

      - name: Deploy approved image to EC2 via SSM
        # No SSH, no inbound port: SSM SendCommand runs the deploy on the instance,
        # which pulls from ECR with its OWN read-only role — the deploy role holds
        # no ECR access at all.
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ needs.push-and-scan.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          EC2_APP_PORT: ${{ vars.EC2_APP_PORT || '3000' }}
          # Digest chain link 5 (scan -> deploy): pull the exact manifest that was
          # scanned and gated, by digest — not a mutable tag.
          IMAGE_DIGEST: ${{ needs.push-and-scan.outputs.image_digest }}
        run: |
          node security/scripts/ssm-deploy.mjs \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --registry "$ECR_REGISTRY" \
            --repository "$ECR_REPOSITORY" \
            --image-digest "$IMAGE_DIGEST" \
            --app-port "$EC2_APP_PORT"
