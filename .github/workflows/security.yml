name: Security checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      break_glass_demo:
        description: Synthetic eligible BLOCK for the Phase 11 interaction demo
        required: true
        default: none
        type: choice
        options:
          - none
          - sast
          - dependency
      break_glass_pr_number:
        description: PR number that receives the audited decision comment
        required: false
        type: string
      break_glass_notify_url:
        description: Override the notify webhook (e.g. the Slack dev endpoint); falls back to vars.BREAK_GLASS_NOTIFY_URL
        required: false
        type: string
      break_glass_status_url:
        description: Override the status webhook (e.g. the Slack dev endpoint); falls back to vars.BREAK_GLASS_STATUS_URL
        required: false
        type: string

permissions:
  contents: read

jobs:
  secret-scanning:
    name: Secret scanning
    runs-on: ubuntu-latest

    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for report normalization
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Create report directory
        run: mkdir -p reports

      - name: Determine secret scan scope
        # pull_request: only commits on the branch since the merge-base with the base branch.
        # push to main: only commits since the previous main tip (github.event.before).
        # schedule / dispatch / anything else: full history.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          BASE_SHA=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
            BASE_SHA="$(git merge-base "origin/$BASE_REF" HEAD || true)"
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              BASE_SHA="$BEFORE_SHA"
            fi
          fi
          if [ -n "$BASE_SHA" ]; then
            echo "GITLEAKS_LOG_OPTS=--log-opts=${BASE_SHA}..HEAD" >> "$GITHUB_ENV"
            echo "TRUFFLEHOG_SINCE=--since-commit=${BASE_SHA}" >> "$GITHUB_ENV"
            echo "Incremental secret scan range ${BASE_SHA}..HEAD (event=$EVENT_NAME)"
          else
            echo "GITLEAKS_LOG_OPTS=--log-opts=HEAD" >> "$GITHUB_ENV"
            echo "TRUFFLEHOG_SINCE=" >> "$GITHUB_ENV"
            echo "Full-history secret scan (event=$EVENT_NAME)"
          fi

      - name: Run Gitleaks (report only)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$GITHUB_WORKSPACE/reports:/reports" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml ${GITLEAKS_LOG_OPTS} --platform github \
            --no-banner --redact=100 --report-format json \
            --report-path /reports/gitleaks.json --exit-code 0

      - name: Run TruffleHog (report only)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            trufflesecurity/trufflehog@sha256:deb2af10659a488a14d262a323addcde099d99827a1cf1dc4e93c17915c39f08 \
            git file:///repo --json --no-update ${TRUFFLEHOG_SINCE} \
            --exclude-paths=/repo/.trufflehog-exclude-paths.txt \
            --results=verified,unverified,unknown --no-fail \
            --fail-on-scan-errors > reports/trufflehog.raw.jsonl
          node security/scripts/normalize-trufflehog.mjs \
            reports/trufflehog.raw.jsonl reports/trufflehog.json

      - name: Upload secret scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-scan-reports
          path: |
            reports/gitleaks.json
            reports/trufflehog.json
          if-no-files-found: error
          retention-days: 14

  dependency-scanning:
    name: Dependency scanning
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Create report directory
        run: mkdir -p reports

      - name: Run npm audit (report only)
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            set +e
            npm audit --json --package-lock-only > reports/npm-audit.json
            audit_status=$?
            set -e
            if node security/scripts/validate-dependency-report.mjs \
              npm-audit reports/npm-audit.json; then
              echo "npm audit produced a valid report (scanner exit $audit_status)"
              exit 0
            fi
            echo "npm audit report attempt $attempt was invalid; retrying" >&2
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          exit 1

      - name: Validate npm audit report
        run: |
          node security/scripts/validate-dependency-report.mjs \
            npm-audit reports/npm-audit.json
          echo "npm audit report is valid; the security gate evaluates findings"

      - name: Run OSV-Scanner (report only)
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/google/osv-scanner@sha256:5116601dedc01c1c580eb92371883ec052fc4c13c3fbc109d621a63ac416d475 \
            scan source --lockfile=/repo/package-lock.json --format=json \
            > reports/osv-scanner.json

      - name: Validate OSV-Scanner report
        run: |
          node security/scripts/validate-dependency-report.mjs \
            osv-scanner reports/osv-scanner.json
          echo "OSV-Scanner report is valid; the security gate evaluates findings"

      - name: Upload dependency scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-scan-reports
          path: |
            reports/npm-audit.json
            reports/osv-scanner.json
          if-no-files-found: error
          retention-days: 14

  sast:
    name: SAST
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so Semgrep can diff against the baseline commit.
          fetch-depth: 0

      - name: Set up Node.js for report validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Create report directory
        run: mkdir -p reports

      - name: Determine SAST scan scope
        # pull_request: only files changed since the merge-base with the base branch.
        # push to main: only files changed since the previous main tip (github.event.before).
        # schedule / dispatch / anything else: full scan (no baseline).
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          BASE_SHA=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
            BASE_SHA="$(git merge-base "origin/$BASE_REF" HEAD || true)"
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              BASE_SHA="$BEFORE_SHA"
            fi
          fi
          if [ -n "$BASE_SHA" ]; then
            echo "SEMGREP_BASELINE=--baseline-commit=${BASE_SHA}" >> "$GITHUB_ENV"
            echo "Incremental SAST scan since ${BASE_SHA} (event=$EVENT_NAME)"
          else
            echo "SEMGREP_BASELINE=" >> "$GITHUB_ENV"
            echo "Full-tree SAST scan (event=$EVENT_NAME)"
          fi

      - name: Run Semgrep OSS (report only)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$GITHUB_WORKSPACE/reports:/reports" \
            -w /src \
            -e HOME=/tmp \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
            semgrep/semgrep@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e \
            semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config security/semgrep-rules.yml \
            ${SEMGREP_BASELINE} \
            --json-output=/reports/semgrep.json \
            --metrics=off \
            --disable-version-check \
            src
          node security/scripts/validate-semgrep-report.mjs reports/semgrep.json
          echo "Semgrep report is ready for the security gate"

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sast-reports
          path: reports/semgrep.json
          if-no-files-found: error
          retention-days: 14

  security-gate:
    name: security-gate
    needs:
      - secret-scanning
      - dependency-scanning
      - sast
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out gate policy and evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Download secret scan reports
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: secret-scan-reports
          path: reports

      - name: Download dependency scan reports
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-scan-reports
          path: reports

      - name: Download SAST report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sast-reports
          path: reports

      - name: Require explicit dev endpoints for a synthetic demo run
        # A synthetic BLOCK must never fall back to the production repo Variables.
        # If break_glass_demo is set, both override URLs must be provided explicitly.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.break_glass_demo != 'none' && (inputs.break_glass_notify_url == '' || inputs.break_glass_status_url == '') }}
        run: |
          echo "A synthetic break_glass_demo run must set BOTH break_glass_notify_url and break_glass_status_url." >&2
          echo "Refusing to fall back to the production BREAK_GLASS_* repo Variables for a synthetic BLOCK." >&2
          exit 1

      - name: Apply synthetic eligible BLOCK for a manual demo
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.break_glass_demo != 'none' }}
        env:
          DEMO_TYPE: ${{ inputs.break_glass_demo }}
        run: |
          case "$DEMO_TYPE" in
            sast)
              cp security/scripts/__fixtures__/new-high-sast/semgrep.json reports/semgrep.json
              ;;
            dependency)
              cp security/scripts/__fixtures__/critical-with-fix/npm-audit.json reports/npm-audit.json
              ;;
            *)
              echo "Unsupported break-glass demo type: $DEMO_TYPE" >&2
              exit 1
              ;;
          esac
          echo "Applied synthetic $DEMO_TYPE BLOCK input; no live vulnerable fixture was activated"

      - name: Evaluate security policy
        id: evaluate
        continue-on-error: true
        run: node security/scripts/security-gate.mjs

      - name: Confirm the BLOCK is eligible before loading any approval credential
        if: ${{ steps.evaluate.outcome == 'failure' }}
        run: node security/scripts/break-glass-notify.mjs --check-only

      - name: Request break-glass decision
        if: ${{ steps.evaluate.outcome == 'failure' }}
        env:
          BREAK_GLASS_NOTIFY_URL: ${{ inputs.break_glass_notify_url || vars.BREAK_GLASS_NOTIFY_URL }}
          BREAK_GLASS_SHARED_SECRET: ${{ secrets.BREAK_GLASS_SHARED_SECRET }}
          BREAK_GLASS_TIMEOUT_SECONDS: ${{ vars.BREAK_GLASS_TIMEOUT_SECONDS }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_PULL_REQUEST: ${{ github.event.pull_request.number || inputs.break_glass_pr_number }}
          CI_SYSTEM: github-actions
        run: node security/scripts/break-glass-notify.mjs

      - name: Wait for verified break-glass decision
        if: ${{ steps.evaluate.outcome == 'failure' }}
        env:
          BREAK_GLASS_STATUS_URL: ${{ inputs.break_glass_status_url || vars.BREAK_GLASS_STATUS_URL }}
          BREAK_GLASS_SHARED_SECRET: ${{ secrets.BREAK_GLASS_SHARED_SECRET }}
          BREAK_GLASS_TIMEOUT_SECONDS: ${{ vars.BREAK_GLASS_TIMEOUT_SECONDS }}
        run: node security/scripts/break-glass-poll.mjs

      - name: Upload security gate decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-gate-results
          path: |
            reports/security-gate.json
            reports/gate-exceptions.json
            reports/break-glass-request.json
            reports/break-glass-decision.json
          if-no-files-found: error
          retention-days: 14

  container-build:
    name: Container build
    # No dependency on security-gate: this job holds zero AWS/ECR credentials and
    # only produces a local image artifact, so it builds in parallel with the
    # scanners and the gate instead of waiting for them. The credential boundary
    # is enforced downstream — aws-configuration and aws-delivery each require a
    # passing security-gate — so on a BLOCK the image is built but never pushed
    # or deployed (a wasted build, never an unsafe one).
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build application image without AWS credentials
        # type=gha reuses unchanged layers (e.g. the npm ci layer when
        # package-lock.json is unchanged) across runs. This is a caching change
        # only — same Dockerfile, same context, so the image content is identical
        # to an uncached build; unchanged layers are restored rather than rebuilt.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: secure-software-delivery:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export application image
        run: docker save "secure-software-delivery:$GITHUB_SHA" | gzip > application-image.tar.gz

      - name: Upload application image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-image-${{ github.sha }}
          path: application-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  aws-configuration:
    name: AWS configuration
    # Requires a passing security-gate (not just container-build): now that the
    # build runs in parallel with the gate, this is where the credential boundary
    # is enforced. A skipped/failed container-build (e.g. PRs, where it does not
    # run) also skips this job, so AWS work only happens on a gated main build.
    needs:
      - security-gate
      - container-build
    if: needs.security-gate.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.detect.outputs.configured }}

    steps:
      - name: Detect AWS delivery configuration
        id: detect
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          missing=()
          for name in AWS_ROLE_ARN AWS_REGION ECR_REPOSITORY EC2_INSTANCE_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "AWS delivery configuration is present; real AWS stages will run"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS not configured — ECR push, image scan, deploy gate, and deploy skipped; see docs/aws-setup.md. Missing: ${missing[*]}"
          fi

  aws-delivery:
    name: AWS delivery
    # The push/deploy job. Explicitly gated on a passing security-gate as well as
    # the parallel build and AWS configuration — a BLOCK leaves security-gate not
    # 'success', so this job is skipped and nothing is ever pushed or deployed.
    needs:
      - security-gate
      - container-build
      - aws-configuration
    if: >-
      needs.security-gate.result == 'success' &&
      needs.aws-configuration.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out delivery scripts and policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Download credential-free image build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: application-image-${{ github.sha }}

      - name: Load application image
        run: gunzip --stdout application-image.tar.gz | docker load

      - name: Assume scoped AWS role with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: secure-software-delivery

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push immutable and demo image tags
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          target="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker tag "secure-software-delivery:$GITHUB_SHA" "$target:$GITHUB_SHA"
          docker tag "secure-software-delivery:$GITHUB_SHA" "$target:demo"
          docker push "$target:$GITHUB_SHA"
          docker push "$target:demo"

      - name: Poll ECR image scan
        continue-on-error: true
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          node security/scripts/poll-ecr-scan.mjs \
            --repository "$ECR_REPOSITORY" \
            --image-tag "$GITHUB_SHA" \
            --region "$AWS_REGION" \
            --output reports/ecr-image-scan.json

      - name: Evaluate deploy policy
        run: node security/scripts/image-gate.mjs

      - name: Upload image scan and deploy-gate reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-security-results
          path: |
            reports/ecr-image-scan.json
            reports/image-gate.json
          if-no-files-found: warn
          retention-days: 14

      - name: Deploy approved image to EC2 via SSM
        # No SSH, no inbound port: SSM SendCommand runs the deploy on the instance,
        # which pulls from ECR with its own read-only role. Uses the OIDC role's
        # ssm:SendCommand + ssm:GetCommandInvocation already in the job env.
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          EC2_APP_PORT: ${{ vars.EC2_APP_PORT || '3000' }}
        run: |
          node security/scripts/ssm-deploy.mjs \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --registry "$ECR_REGISTRY" \
            --repository "$ECR_REPOSITORY" \
            --image-tag "$GITHUB_SHA" \
            --app-port "$EC2_APP_PORT"
