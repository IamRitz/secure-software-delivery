name: Security checks

# PR + scheduled security. This is the file another repository copies to onboard:
# a build job it owns, two calls into the shared security workflows, and two thin
# jobs that publish stable check names for branch protection.
#
# TRIGGER OWNERSHIP: this workflow owns `pull_request` and `schedule`.
# `deploy.yml` owns `push` to main and `workflow_dispatch`. Neither reacts to the
# other's events, so scanners run exactly once per event.
#
# SECURITY: keep this `pull_request` — never `pull_request_target`. The
# developer-readable notifier holds `pull-requests: write`; on the
# `pull_request` event GitHub forces the GITHUB_TOKEN read-only for fork PRs
# and withholds other secrets, so untrusted fork code cannot write a PR comment
# or read the Slack URL. `pull_request_target` would run with a writable token
# against fork code and break that guarantee.
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  source-security:
    # Only ONE secret crosses this boundary: the break-glass HMAC shared secret,
    # passed explicitly so an approver can unblock a PR. It is not a cloud
    # credential and grants no AWS access. NEVER change this to
    # `secrets: inherit` — that would hand every repo secret to the scanning jobs.
    # On a fork PR GitHub withholds it entirely, so an eligible BLOCK simply
    # fails closed rather than reaching the approval channel.
    uses: ./.github/workflows/_source-security.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      gate_mode: ${{ vars.GATE_MODE || 'enforce' }}
      semgrep_configs: |
        p/owasp-top-ten
        p/javascript
        security/semgrep-rules.yml
      semgrep_paths: src
      slack_notify_url: ${{ vars.SECURITY_NOTIFY_SLACK_URL }}
      reproduce_commands: >-
        {"gitleaks":"make secrets","trufflehog":"make secrets","npm-audit":"make dependencies",
        "pip-audit":"make dependencies","osv-scanner":"make dependencies","semgrep":"make sast",
        "trivy":"make image-gate","ecr-image-scan":"make image-gate"}
      break_glass_enabled: true
      break_glass_notify_url: ${{ vars.BREAK_GLASS_NOTIFY_URL }}
      break_glass_status_url: ${{ vars.BREAK_GLASS_STATUS_URL }}
      break_glass_timeout_seconds: ${{ vars.BREAK_GLASS_TIMEOUT_SECONDS }}
    secrets:
      break_glass_shared_secret: ${{ secrets.BREAK_GLASS_SHARED_SECRET }}

  security-gate:
    # Stable check name for branch protection. Moving the gate into a reusable
    # workflow renames its own check to `source-security / source-gate`; this job
    # keeps the required context `security-gate` resolving, and keeps the public
    # check name independent of the internal job layout.
    #
    # This name is a CONSTANT and must stay one. Branch protection matches
    # required checks by exact string, so a name that varied by gate mode would
    # stop matching in one of the two modes and the rule would silently protect
    # nothing. Mode visibility lives in the separate `gate-mode` check below,
    # which is deliberately NOT a required context.
    name: security-gate
    needs: source-security
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report the source security verdict
        env:
          RESULT: ${{ needs.source-security.result }}
          VERDICT: ${{ needs.source-security.outputs.verdict }}
          MODE: ${{ needs.source-security.outputs.gate_mode }}
          TRUSTED: ${{ needs.source-security.outputs.integrity_trusted }}
        run: |
          echo "Source security verdict: ${VERDICT:-unknown} (job result: $RESULT)"
          echo "Gate mode: ${MODE:-unknown}; scan trusted: ${TRUSTED:-unknown}"
          if [ "$MODE" = "log-only" ]; then
            echo "::warning::This check is GREEN BY CONFIGURATION, not by verdict — gate_mode is log-only, so a BLOCK does not fail it. See the 'gate-mode' check."
          fi
          if [ "$RESULT" != "success" ]; then
            exit 1
          fi

  gate-mode:
    # Mode visibility, as its own check whose NAME carries the mode — so a
    # reviewer sees `log-only` in the PR checks list without opening the run to
    # find the ::warning::. It is intentionally NOT a required context, which is
    # what makes a varying name safe here: nothing matches it by string.
    #
    # The mode is read back from `needs.source-security.outputs.gate_mode` — the
    # value the reusable workflow actually evaluated under — not from
    # `vars.GATE_MODE`. Reading the variable would let an edit to this caller's
    # `with:` block put the gate in log-only while this check still displayed
    # "enforce", which is precisely the bypass this is meant to surface.
    #
    # It goes RED when log-only is actually suppressing something: a BLOCK that
    # would otherwise have failed, or a scan whose integrity could not be
    # trusted. Red-but-not-required means visible without blocking the merge the
    # repo has deliberately chosen not to block.
    name: "${{ needs.source-security.outputs.gate_mode == 'log-only' && 'gate-mode: LOG-ONLY (gate NOT enforcing)' || format('gate-mode: {0}', needs.source-security.outputs.gate_mode || 'unknown') }}"
    needs:
      - source-security
      - image-security
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report the effective gate mode
        env:
          MODE: ${{ needs.source-security.outputs.gate_mode }}
          SOURCE_VERDICT: ${{ needs.source-security.outputs.verdict }}
          SOURCE_TRUSTED: ${{ needs.source-security.outputs.integrity_trusted }}
          IMAGE_RESULT: ${{ needs.image-security.result }}
          IMAGE_VERDICT: ${{ needs.image-security.outputs.verdict }}
          IMAGE_TRUSTED: ${{ needs.image-security.outputs.integrity_trusted }}
        run: |
          {
            echo "## Gate mode: \`${MODE:-unknown}\`"
            echo
            echo "| | verdict | scan trusted |"
            echo "| --- | --- | --- |"
            echo "| source security | \`${SOURCE_VERDICT:-unknown}\` | \`${SOURCE_TRUSTED:-unknown}\` |"
            if [ "$IMAGE_RESULT" = "skipped" ]; then
              echo "| pre-push image | _not run_ | _n/a_ |"
            else
              echo "| pre-push image | \`${IMAGE_VERDICT:-unknown}\` | \`${IMAGE_TRUSTED:-unknown}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          suppressed=""
          if [ "$SOURCE_TRUSTED" != "true" ]; then
            suppressed="$suppressed source-scan-not-trusted"
          fi
          if [ "$IMAGE_RESULT" != "skipped" ] && [ "$IMAGE_TRUSTED" != "true" ]; then
            suppressed="$suppressed image-scan-not-trusted"
          fi
          if [ "$MODE" = "log-only" ]; then
            echo "::warning::gate_mode is log-only — the required \`security-gate\` check cannot fail on findings in this repository."
            if [ "$SOURCE_VERDICT" = "BLOCK" ]; then
              suppressed="$suppressed source-BLOCK-suppressed"
            fi
            if [ "$IMAGE_VERDICT" = "BLOCK_DEPLOY" ]; then
              suppressed="$suppressed image-BLOCK_DEPLOY-suppressed"
            fi
          fi

          if [ -n "$suppressed" ]; then
            echo "::error::Findings are not being enforced or not trustworthy:$suppressed"
            echo "> ⛔ **Not enforced / not trustworthy:**$suppressed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Gate mode ${MODE:-unknown}: nothing suppressed, scans trusted."

  container-build:
    # Repo-specific: the consumer owns its own build. Holds ZERO cloud
    # credentials — it only builds the image and uploads it as a tarball
    # artifact, which `_image-scan-prepush.yml` then scans.
    name: Container build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build application image without AWS credentials
        # PR builds use the type=gha layer cache for fast feedback. The release
        # build on main (deploy.yml) uses no-cache so a potentially poisoned
        # Actions cache entry can never be baked into the image that ships.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: secure-software-delivery:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image tarball
        run: docker save -o application-image.tar "secure-software-delivery:$GITHUB_SHA"

      - name: Upload image tarball for the scan job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-image-${{ github.sha }}
          path: application-image.tar
          if-no-files-found: error
          retention-days: 1

  image-security:
    # Optional by construction: a repo that ships no container deletes this job
    # and `container-build`. `_source-security.yml` does not depend on either.
    # NOTE: no `secrets: inherit`; this call passes no secrets at all.
    needs: container-build
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/_image-scan-prepush.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      image_artifact: application-image-${{ github.sha }}
      gate_mode: ${{ vars.GATE_MODE || 'enforce' }}
      slack_notify_url: ${{ vars.SECURITY_NOTIFY_SLACK_URL }}
      reproduce_commands: '{"trivy":"make image-gate","ecr-image-scan":"make image-gate"}'

  image-gate:
    # Stable check name for the pre-push image verdict, mirroring `security-gate`.
    # Not currently a required context in branch protection — see docs/github-actions.md.
    name: image-gate
    needs: image-security
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report the pre-push image verdict
        env:
          RESULT: ${{ needs.image-security.result }}
          VERDICT: ${{ needs.image-security.outputs.verdict }}
        run: |
          echo "Pre-push image verdict: ${VERDICT:-unknown} (job result: $RESULT)"
          if [ "$RESULT" != "success" ]; then
            exit 1
          fi
