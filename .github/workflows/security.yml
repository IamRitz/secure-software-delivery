name: Security checks

# PR + scheduled security. This is the file another repository copies to onboard:
# a build job it owns, two calls into the shared security workflows, and two thin
# jobs that publish stable check names for branch protection.
#
# TRIGGER OWNERSHIP: this workflow owns `pull_request` and `schedule`.
# `deploy.yml` owns `push` to main and `workflow_dispatch`. Neither reacts to the
# other's events, so scanners run exactly once per event.
#
# SECURITY: keep this `pull_request` — never `pull_request_target`. The
# developer-readable notifier holds `pull-requests: write`; on the
# `pull_request` event GitHub forces the GITHUB_TOKEN read-only for fork PRs
# and withholds other secrets, so untrusted fork code cannot write a PR comment
# or read the Slack URL. `pull_request_target` would run with a writable token
# against fork code and break that guarantee.
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  source-security:
    # Only ONE secret crosses this boundary: the break-glass HMAC shared secret,
    # passed explicitly so an approver can unblock a PR. It is not a cloud
    # credential and grants no AWS access. NEVER change this to
    # `secrets: inherit` — that would hand every repo secret to the scanning jobs.
    # On a fork PR GitHub withholds it entirely, so an eligible BLOCK simply
    # fails closed rather than reaching the approval channel.
    uses: ./.github/workflows/_source-security.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      gate_mode: ${{ vars.GATE_MODE || 'enforce' }}
      semgrep_configs: |
        p/owasp-top-ten
        p/javascript
        security/semgrep-rules.yml
      semgrep_paths: src
      slack_notify_url: ${{ vars.SECURITY_NOTIFY_SLACK_URL }}
      reproduce_commands: >-
        {"gitleaks":"make secrets","trufflehog":"make secrets","npm-audit":"make dependencies",
        "pip-audit":"make dependencies","osv-scanner":"make dependencies","semgrep":"make sast",
        "trivy":"make image-gate","ecr-image-scan":"make image-gate"}
      break_glass_enabled: true
      break_glass_notify_url: ${{ vars.BREAK_GLASS_NOTIFY_URL }}
      break_glass_status_url: ${{ vars.BREAK_GLASS_STATUS_URL }}
      break_glass_timeout_seconds: ${{ vars.BREAK_GLASS_TIMEOUT_SECONDS }}
    secrets:
      break_glass_shared_secret: ${{ secrets.BREAK_GLASS_SHARED_SECRET }}

  security-gate:
    # Stable check name for branch protection. Moving the gate into a reusable
    # workflow renames its own check to `source-security / source-gate`; this job
    # keeps the required context `security-gate` resolving, and keeps the public
    # check name independent of the internal job layout.
    name: security-gate
    needs: source-security
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report the source security verdict
        env:
          RESULT: ${{ needs.source-security.result }}
          VERDICT: ${{ needs.source-security.outputs.verdict }}
        run: |
          echo "Source security verdict: ${VERDICT:-unknown} (job result: $RESULT)"
          if [ "$RESULT" != "success" ]; then
            exit 1
          fi

  container-build:
    # Repo-specific: the consumer owns its own build. Holds ZERO cloud
    # credentials — it only builds the image and uploads it as a tarball
    # artifact, which `_image-scan-prepush.yml` then scans.
    name: Container build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build application image without AWS credentials
        # PR builds use the type=gha layer cache for fast feedback. The release
        # build on main (deploy.yml) uses no-cache so a potentially poisoned
        # Actions cache entry can never be baked into the image that ships.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: secure-software-delivery:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image tarball
        run: docker save -o application-image.tar "secure-software-delivery:$GITHUB_SHA"

      - name: Upload image tarball for the scan job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-image-${{ github.sha }}
          path: application-image.tar
          if-no-files-found: error
          retention-days: 1

  image-security:
    # Optional by construction: a repo that ships no container deletes this job
    # and `container-build`. `_source-security.yml` does not depend on either.
    # NOTE: no `secrets: inherit`; this call passes no secrets at all.
    needs: container-build
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/_image-scan-prepush.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      image_artifact: application-image-${{ github.sha }}
      gate_mode: ${{ vars.GATE_MODE || 'enforce' }}
      slack_notify_url: ${{ vars.SECURITY_NOTIFY_SLACK_URL }}
      reproduce_commands: '{"trivy":"make image-gate","ecr-image-scan":"make image-gate"}'

  image-gate:
    # Stable check name for the pre-push image verdict, mirroring `security-gate`.
    # Not currently a required context in branch protection — see docs/github-actions.md.
    name: image-gate
    needs: image-security
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report the pre-push image verdict
        env:
          RESULT: ${{ needs.image-security.result }}
          VERDICT: ${{ needs.image-security.outputs.verdict }}
        run: |
          echo "Pre-push image verdict: ${VERDICT:-unknown} (job result: $RESULT)"
          if [ "$RESULT" != "success" ]; then
            exit 1
          fi
